<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Comland Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e2a2f;--panel:#163940;--line:#27545c;--text:#e8f1ef;--muted:#8fb0ab;--gold:#f5b83d;--bad:#ff8a7a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 64px}
h1,h2{margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.1rem;margin-bottom:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.number{font-size:clamp(2.4rem,11vw,3.6rem);font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.02em;margin:4px 0 0}
.muted{color:var(--muted);font-size:.9rem}
input,button{font:inherit;border-radius:10px;border:1px solid var(--line);padding:11px 13px}
input{background:var(--bg);color:var(--text);width:100%}
input:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{background:var(--gold);color:#1a1405;font-weight:600;cursor:pointer;border-color:var(--gold)}
button.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.row{display:flex;gap:8px;margin-top:8px}
.row button{white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.msg{padding:10px 12px;border-radius:12px;margin-top:8px;max-width:88%;word-break:break-word}
.msg.in{background:var(--bg);border:1px solid var(--line)}
.msg.out{background:#2b5a3f;margin-left:auto}
.msg small{display:block;color:var(--muted);margin-bottom:2px;cursor:pointer}
button.bad{background:var(--bad);border-color:var(--bad)}
.call{border-color:var(--gold)}
#err{color:var(--bad);min-height:1.4em;margin-top:12px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.number{transition:opacity .2s}}
</style>
</head>
<body>
<div class="wrap">
  <h1>New Comland Phone</h1>
  <p class="muted">The phone network for New Comland. Sign in to get your number.</p>

  <section id="login" class="panel">
    <button id="signin">Sign in with Google</button>
  </section>

  <section id="main" hidden>
    <div class="panel">
      <div class="top">
        <span class="muted" id="who"></span>
        <button class="ghost" id="signout">Sign out</button>
      </div>
      <p class="muted" style="margin:14px 0 0">Your number</p>
      <p class="number" id="mynum">...</p>
    </div>

    <div class="panel call" id="call" hidden>
      <p class="muted" style="margin:0">Phone call</p>
      <p class="number" style="font-size:1.6rem" id="callstatus"></p>
      <div class="row">
        <button id="accept" hidden>Answer</button>
        <button class="bad" id="decline" hidden>Decline</button>
        <button class="bad" id="hangup" hidden>Hang up</button>
      </div>
      <audio id="remote" autoplay></audio>
    </div>

    <div class="panel">
      <h2>Choose a custom number</h2>
      <p class="muted" style="margin:0">3 to 9 digits. Taking a new number frees your old one.</p>
      <div class="row">
        <input id="custom" inputmode="numeric" maxlength="9" placeholder="e.g. 5551234" autocomplete="off">
        <button id="claim">Claim number</button>
      </div>
    </div>

    <div class="panel">
      <h2>Call or message</h2>
      <input id="to" inputmode="numeric" maxlength="9" placeholder="Their number" autocomplete="off">
      <div class="row"><button id="dial">Call this number</button></div>
      <div class="row">
        <input id="text" maxlength="500" placeholder="Write a message" autocomplete="off">
        <button id="send">Send</button>
      </div>
    </div>

    <div class="panel">
      <h2>Messages</h2>
      <div id="list"><p class="muted">No messages yet. Send the first one.</p></div>
    </div>
  </section>

  <p id="err" role="alert"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, runTransaction, serverTimestamp, collection, addDoc, setDoc, updateDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDTFHD3M0K3bEwlGGPCMQtLVz3Hh-zobL8",
  authDomain: "new-comland-phone.firebaseapp.com",
  projectId: "new-comland-phone",
  storageBucket: "new-comland-phone.firebasestorage.app",
  messagingSenderId: "106971474566",
  appId: "1:106971474566:web:d5b5e2fa2b10930bf23f07",
  measurementId: "G-4QS2Q105P1"
});
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const RESERVED = ["911","112","999","000"];
let me = null, myNumber = null, unsub = null;

const fmt = n => n ? n.replace(/(\d{3})(?=\d)/g, "$1 ").trim() : "";
const showErr = m => { $("err").textContent = m || ""; };

function randomNumber() {
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return String(100000000 + (a[0] % 900000000));
}

// Claims `number` for the user. Frees their old number in the same transaction.
async function claimNumber(uid, number, name) {
  const numRef = doc(db, "numbers", number);
  const userRef = doc(db, "users", uid);
  await runTransaction(db, async tx => {
    const [n, u] = await Promise.all([tx.get(numRef), tx.get(userRef)]);
    if (n.exists()) throw new Error("taken");
    const old = u.exists() ? u.data().phoneNumber : null;
    if (old) tx.delete(doc(db, "numbers", old));
    tx.set(numRef, { uid, createdAt: serverTimestamp() });
    tx.set(userRef, { phoneNumber: number, name: name || "" }, { merge: true });
  });
  return number;
}

async function ensureNumber(user) {
  const snap = await getDoc(doc(db, "users", user.uid));
  if (snap.exists() && snap.data().phoneNumber) return snap.data().phoneNumber;
  for (let i = 0; i < 10; i++) {
    try { return await claimNumber(user.uid, randomNumber(), user.displayName); }
    catch (e) { if (e.message !== "taken") throw e; }
  }
  throw new Error("Could not find a free number. Try signing in again.");
}

$("signin").onclick = async () => {
  showErr();
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { showErr("Sign-in failed: " + e.code); }
};
$("signout").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  if (unsub) { unsub(); unsub = null; }
  if (unsubCalls) { unsubCalls(); unsubCalls = null; }
  incoming = null; cleanup();
  me = user; myNumber = null;
  $("login").hidden = !!user;
  $("main").hidden = !user;
  if (!user) return;
  $("who").textContent = user.displayName || user.email;
  try {
    myNumber = await ensureNumber(user);
    $("mynum").textContent = fmt(myNumber);
    listen();
    listenCalls();
  } catch (e) { showErr(e.message); }
});

$("claim").onclick = async () => {
  showErr();
  const n = $("custom").value.trim();
  if (!/^[0-9]{3,9}$/.test(n)) return showErr("Use 3 to 9 digits, numbers only.");
  if (RESERVED.includes(n)) return showErr("That number is reserved.");
  if (n === myNumber) return showErr("That is already your number.");
  try {
    myNumber = await claimNumber(me.uid, n, me.displayName);
    $("mynum").textContent = fmt(myNumber);
    $("custom").value = "";
  } catch (e) {
    showErr(e.message === "taken" ? "That number is taken. Try another." : "Could not claim number: " + e.message);
  }
};

$("send").onclick = async () => {
  showErr();
  const to = $("to").value.trim(), text = $("text").value.trim();
  if (!/^[0-9]{3,9}$/.test(to)) return showErr("Enter the number you want to message.");
  if (!text) return showErr("Write a message first.");
  try {
    const target = await getDoc(doc(db, "numbers", to));
    if (!target.exists()) return showErr("No one has the number " + fmt(to) + ".");
    await addDoc(collection(db, "messages"), {
      from: myNumber, to, text,
      uids: [me.uid, target.data().uid],
      createdAt: serverTimestamp()
    });
    $("text").value = "";
  } catch (e) { showErr("Could not send: " + e.message); }
};

// ---------- Voice calls (WebRTC, signaling through Firestore) ----------
const ICE = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }] };
let pc = null, localStream = null, callRef = null, callUnsubs = [], incoming = null, unsubCalls = null, pending = [];

function callUI(text, mode) {
  $("call").hidden = !text;
  $("callstatus").textContent = text || "";
  $("accept").hidden = mode !== "incoming";
  $("decline").hidden = mode !== "incoming";
  $("hangup").hidden = mode === "incoming" || !text;
}

async function setupPeer() {
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  pc = new RTCPeerConnection(ICE);
  pending = [];
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = e => { $("remote").srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => {
    if (!pc) return;
    if (pc.connectionState === "connected") callUI("Connected", "active");
    if (pc.connectionState === "failed") { showErr("The call dropped."); hangup(); }
  };
}

async function addCandidate(c) {
  if (pc?.remoteDescription) await pc.addIceCandidate(c).catch(() => {});
  else pending.push(c);
}
async function flushCandidates() {
  for (const c of pending) await pc.addIceCandidate(c).catch(() => {});
  pending = [];
}
function watchCandidates(side) {
  callUnsubs.push(onSnapshot(collection(db, "calls", callRef.id, side), s =>
    s.docChanges().forEach(ch => {
      if (ch.type === "added") addCandidate(new RTCIceCandidate(ch.doc.data()));
    })));
}

function cleanup() {
  callUnsubs.forEach(u => u());
  callUnsubs = [];
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  $("remote").srcObject = null;
  callRef = null;
  callUI("");
}

async function hangup() {
  const r = callRef;
  cleanup();
  if (r) await updateDoc(r, { status: "ended" }).catch(() => {});
}

async function startCall(to) {
  if (pc) return showErr("You are already on a call.");
  if (to === myNumber) return showErr("You can't call your own number.");
  const target = await getDoc(doc(db, "numbers", to));
  if (!target.exists()) return showErr("No one has the number " + fmt(to) + ".");
  try { await setupPeer(); }
  catch { cleanup(); return showErr("Allow microphone access to make calls."); }
  callRef = doc(collection(db, "calls"));
  await setDoc(callRef, {
    from: myNumber, to, fromUid: me.uid, toUid: target.data().uid,
    status: "ringing", createdAt: serverTimestamp()
  });
  pc.onicecandidate = e => e.candidate &&
    addDoc(collection(db, "calls", callRef.id, "callerCandidates"), e.candidate.toJSON());
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await updateDoc(callRef, { offer: { type: offer.type, sdp: offer.sdp } });
  callUI("Calling " + fmt(to) + "...", "out");
  callUnsubs.push(onSnapshot(callRef, async s => {
    const d = s.data();
    if (!d || !pc) return;
    if (d.answer && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(d.answer);
      await flushCandidates();
    }
    if (d.status === "declined") { showErr("Call declined."); cleanup(); }
    if (d.status === "ended") cleanup();
  }));
  watchCandidates("calleeCandidates");
}

function listenCalls() {
  const q = query(collection(db, "calls"),
    where("toUid", "==", me.uid), where("status", "==", "ringing"));
  unsubCalls = onSnapshot(q, snap => {
    const ring = snap.docs.find(d => d.data().offer &&
      Date.now() - (d.data().createdAt?.toMillis?.() ?? Date.now()) < 60000);
    if (ring && !pc && !incoming) {
      incoming = ring;
      callUI("Incoming call from " + fmt(ring.data().from), "incoming");
    } else if (!ring && incoming && !pc) {
      incoming = null;
      callUI("");
    }
  }, e => showErr("Could not listen for calls: " + e.code));
}

$("dial").onclick = () => {
  showErr();
  const to = $("to").value.trim();
  if (!/^[0-9]{3,9}$/.test(to)) return showErr("Enter the number you want to call.");
  startCall(to).catch(e => { cleanup(); showErr("Could not start the call: " + e.message); });
};

$("accept").onclick = async () => {
  const d = incoming.data();
  callRef = incoming.ref;
  incoming = null;
  try { await setupPeer(); }
  catch {
    await updateDoc(callRef, { status: "declined" }).catch(() => {});
    cleanup();
    return showErr("Allow microphone access to answer calls.");
  }
  pc.onicecandidate = e => e.candidate &&
    addDoc(collection(db, "calls", callRef.id, "calleeCandidates"), e.candidate.toJSON());
  await pc.setRemoteDescription(d.offer);
  watchCandidates("callerCandidates");
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await updateDoc(callRef, { answer: { type: answer.type, sdp: answer.sdp }, status: "active" });
  callUI("Connecting...", "active");
  callUnsubs.push(onSnapshot(callRef, s => { if (s.data()?.status === "ended") cleanup(); }));
};

$("decline").onclick = async () => {
  const r = incoming.ref;
  incoming = null;
  callUI("");
  await updateDoc(r, { status: "declined" }).catch(() => {});
};

$("hangup").onclick = hangup;

function listen() {
  const q = query(collection(db, "messages"), where("uids", "array-contains", me.uid));
  unsub = onSnapshot(q, snap => {
    const msgs = snap.docs.map(d => d.data())
      .sort((a, b) => (a.createdAt?.seconds ?? 9e12) - (b.createdAt?.seconds ?? 9e12));
    const list = $("list");
    list.textContent = "";
    if (!msgs.length) {
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = "No messages yet. Send the first one.";
      list.append(p);
      return;
    }
    for (const m of msgs) {
      const mine = m.from === myNumber;
      const other = mine ? m.to : m.from;
      const box = document.createElement("div");
      box.className = "msg " + (mine ? "out" : "in");
      const label = document.createElement("small");
      label.textContent = (mine ? "To " : "From ") + fmt(other);
      label.title = "Tap to reply";
      label.onclick = () => { $("to").value = other; $("text").focus(); };
      const body = document.createElement("div");
      body.textContent = m.text;
      box.append(label, body);
      list.append(box);
    }
    list.lastChild.scrollIntoView({ block: "nearest" });
  }, e => showErr("Could not load messages: " + e.code));
}
</script>
</body>
</html>
